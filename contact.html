<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrimsonMediaVisuuals</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- custom cursor -->
    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-ring" aria-hidden="true"></div>

    <header class="header">
        <a href="index.html" class="logo">Portfolio</a>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="index.html#portfoliocards">Work</a>
            <a href="services.html">Services</a>
            <a href="contact.html" class="nav-contact">Contact</a>
        </nav>
    </header>

    <section class="contact-section">

        <div class="contact-content">

            <div id="contact-text">
                <h1>Get In Touch</h1>

                <a class="contact-info" href="mailto:tedo.mirianashvili@gmail.com">
                    <img src="./image/ic_baseline-email.png" alt="" aria-hidden="true">
                    <span class="contact-type">tedo.mirianashvili@gmail.com</span>
                </a>

                <a class="contact-info" href="https://wa.me/995599270793" target="_blank" rel="noopener noreferrer">
                    <img src="./image/ic_baseline-whatsapp.png" alt="" aria-hidden="true">
                    <span class="contact-type">(+995) 599-270-793</span>
                </a>
            </div>

            <div id="functionalWindow">

                <!-- REPLACE YOUR_FORM_ID below with the endpoint Formspree gives you,
                     e.g. https://formspree.io/f/xabcwxyz -->
                <form id="contactForm" action="https://formspree.io/f/mwleblwv" method="POST">

                    <!-- sets the subject line of the email you receive -->
                    <input type="hidden" name="_subject" value="New message from portfolio site">

                    <div class="contact-form">
                        <label for="c_name">Name :</label>
                        <div class="window">
                            <input type="text" id="c_name" name="name" placeholder="JANNE DOE" autocomplete="name" required>
                        </div>
                    </div>

                    <div class="contact-form">
                        <label for="c_email">Email Address :</label>
                        <div class="window">
                            <input type="email" id="c_email" name="email" placeholder="JANNE.DOE@email.com" autocomplete="email" required>
                        </div>
                    </div>

                    <div class="contact-form">
                        <label for="c_subject">Subject : <span class="field-optional">optional</span></label>
                        <div class="window">
                            <input type="text" id="c_subject" name="subject" placeholder="Title....">
                        </div>
                    </div>

                    <div class="contact-form">
                        <label for="c_message">Message :</label>
                        <div class="window">
                            <textarea id="c_message" name="message" placeholder="Type in here...." required></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn-send">
                        <span>SEND</span>
                        <img src="./image/servicearrow.svg" alt="" aria-hidden="true">
                    </button>
                    <p class="form-note"></p>

                </form>

            </div>

        </div>

    </section>

    <footer></footer>

    <script src="script.js"></script>
    <script src="js/contact.js"></script>
</body>
</html>
